name: Build

on:
  push:
    branches: [ custom-engine ]
  pull_request:
    branches: [ custom-engine ]

jobs:
  build:
    runs-on: windows-latest

    steps:

    - name: Checkout
      uses: actions/checkout@v4


    - name: Install dependencies
      shell: cmd
      run: |

        echo ==== Clone vcpkg ====

        git clone https://github.com/microsoft/vcpkg.git NoxCore\vendors\vcpkg


        echo ==== Bootstrap ====

        cd NoxCore\vendors\vcpkg

        bootstrap-vcpkg.bat

        if errorlevel 1 exit /b 1


        echo ==== vcpkg version ====

        vcpkg.exe version


        cd ..\..\..


        echo ==== Install packages ====

        NoxCore\vendors\vcpkg\vcpkg.exe install ^
          sdl3[vulkan] ^
          glm ^
          entt ^
          spdlog ^
          xxhash ^
          yaml-cpp ^
          box2d ^
          imguizmo ^
          freetype ^
          skia ^
          stb ^
          ktx[vulkan] ^
          tinyobjloader ^
          --triplet=x64-windows


        if errorlevel 1 exit /b 1



    - name: Verify vcpkg installation
      shell: cmd
      run: |

        echo ==== VCPKG PACKAGES ====

        NoxCore\vendors\vcpkg\vcpkg.exe list


        echo ==== SDL3 FILES ====

        dir NoxCore\vendors\vcpkg\installed\x64-windows\share\sdl3



    - name: Install Slang
      shell: cmd
      run: |

        set SLANG_VERSION=2026.13

        curl -L ^
        https://github.com/shader-slang/slang/releases/download/v%SLANG_VERSION%/slang-%SLANG_VERSION%-windows-x86_64.zip ^
        -o slang.zip


        mkdir NoxCore\vendors\slang


        tar -xf slang.zip -C NoxCore\vendors\slang


        del slang.zip



    - name: Configure CMake
      shell: cmd
      run: |

        cmake -S . -B build ^
        -G "Visual Studio 18 2026" ^
        -T ClangCL ^
        -A x64 ^
        -DCMAKE_TOOLCHAIN_FILE=NoxCore\vendors\vcpkg\scripts\buildsystems\vcpkg.cmake



    - name: Build
      shell: cmd
      run: |

        cmake --build build --config Release
